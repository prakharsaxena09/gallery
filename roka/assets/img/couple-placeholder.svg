<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1147"/>
      <stop offset="0.5" stop-color="#3a2a78"/>
      <stop offset="1" stop-color="#5a1020"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#e7c068" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#e7c068" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="600" fill="url(#g)"/>
  <rect width="600" height="600" fill="url(#glow)"/>
  <!-- subtle stars -->
  <g fill="#fff" opacity="0.7">
    <circle cx="80" cy="90" r="2"/><circle cx="520" cy="70" r="1.6"/><circle cx="150" cy="180" r="1.4"/>
    <circle cx="470" cy="200" r="2"/><circle cx="90" cy="430" r="1.6"/><circle cx="540" cy="470" r="1.8"/>
    <circle cx="300" cy="60" r="1.4"/><circle cx="430" cy="520" r="1.5"/><circle cx="200" cy="540" r="1.6"/>
  </g>
  <!-- decorative ring -->
  <circle cx="300" cy="300" r="220" fill="none" stroke="#e7c068" stroke-opacity="0.5" stroke-width="2"/>
  <circle cx="300" cy="300" r="232" fill="none" stroke="#e7c068" stroke-opacity="0.25" stroke-width="1"/>
  <!-- monogram -->
  <text x="300" y="290" font-family="Georgia, 'Times New Roman', serif" font-size="150" font-weight="bold"
        text-anchor="middle" fill="#f7f3ea">P</text>
  <text x="300" y="300" font-family="Arial, sans-serif" font-size="74" text-anchor="middle" fill="#ff8fb0">&#10084;</text>
  <text x="300" y="430" font-family="Georgia, 'Times New Roman', serif" font-size="150" font-weight="bold"
        text-anchor="middle" fill="#f7f3ea">P</text>
  <!-- names + date -->
  <text x="300" y="500" font-family="Georgia, serif" font-size="30" letter-spacing="3"
        text-anchor="middle" fill="#e7c068">PRAKHAR &amp; PRANJALI</text>
  <text x="300" y="540" font-family="Arial, sans-serif" font-size="20" letter-spacing="2"
        text-anchor="middle" fill="#cfd0ef">ROKA &#183; 27 NOV 2026 &#183; LUCKNOW</text>
</svg>
