name: Deploy invitation to GitHub Pages

# Builds the Astro invitation in invitation/ and publishes it to GitHub Pages
# at https://<owner>.github.io/gallery/. One-time setup: in the repository,
# Settings → Pages → Build and deployment → Source: "GitHub Actions".

on:
  push:
    branches: [claude/wedding-invitation-build-65aq32]
    paths: ['invitation/**', '.github/workflows/deploy-invitation.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: invitation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: invitation/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          SITE_BASE: /gallery/
          SITE_ORIGIN: https://${{ github.repository_owner }}.github.io
      - uses: actions/upload-pages-artifact@v3
        with:
          path: invitation/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
